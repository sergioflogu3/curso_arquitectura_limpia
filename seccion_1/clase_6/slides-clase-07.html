<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Clase 7 — Single Responsibility</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap');
  :root {
    --bg:#141432; --bg2:#1a1a42; --bg3:#1e1e4a;
    --pink:#ff69b4; --pink-dim:rgba(255,105,180,0.55);
    --orange:#e8a87c; --white:#f0f0f0; --white-dim:rgba(240,240,240,0.65);
    --margin-left:80px; --margin-right:80px; --margin-top:120px; --margin-bottom:120px;
    --icon-size:120px; --icon-right:80px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Outfit',sans-serif; background:#000; color:var(--white); overflow:hidden; }
  .slide {
    width:1920px; height:1080px; position:fixed; top:50%; left:50%;
    transform:translate(-50%,-50%); overflow:hidden;
    background:linear-gradient(145deg,var(--bg) 0%,var(--bg2) 60%,var(--bg3) 100%);
    opacity:0; pointer-events:none; transition:opacity 0.4s ease;
  }
  .slide.active { opacity:1; pointer-events:auto; }
  .deco-tr { position:absolute; top:40px; right:40px; display:flex; align-items:center; gap:12px; }
  .deco-tr .ln { width:100px; height:3px; background:var(--pink); }
  .deco-tr .sq { width:24px; height:24px; background:var(--pink); }
  .deco-bl { position:absolute; bottom:50px; left:60px; display:flex; align-items:center; gap:12px; }
  .deco-bl .sq { width:20px; height:20px; background:var(--pink); }
  .deco-bl .ln { width:80px; height:3px; background:var(--pink); }
  .dots { position:absolute; bottom:60px; right:var(--icon-right); display:grid; grid-template-columns:repeat(10,1fr); gap:14px; }
  .dots .d { width:6px; height:6px; border-radius:50%; background:var(--pink-dim); }
  .logo { position:absolute; top:40px; left:60px; height:36px; opacity:.95; }
  .side-icon { position:absolute; right:var(--icon-right); top:50%; transform:translateY(-50%); font-size:var(--icon-size); line-height:1; }
  .t-xl { font-size:96px; font-weight:800; line-height:1.05; color:var(--pink); letter-spacing:-2px; }
  .t-lg { font-size:72px; font-weight:800; line-height:1.1; color:var(--orange); letter-spacing:-1px; }
  .author { font-size:22px; font-weight:300; color:var(--white-dim); position:absolute; bottom:70px; left:60px; }
  .phrase { font-size:48px; font-weight:300; font-style:italic; color:var(--white-dim); text-align:center; line-height:1.5; }
  .layout-center {
    position:absolute; top:var(--margin-top); left:var(--margin-left);
    right:var(--margin-right); bottom:var(--margin-bottom);
    display:flex; flex-direction:column; justify-content:center;
  }
  .layout {
    position:absolute; top:var(--margin-top); left:var(--margin-left);
    right:var(--margin-right); bottom:var(--margin-bottom);
    display:flex; flex-direction:column;
  }
  .layout-heading { flex:0 0 auto; }
  .layout-content { flex:1; display:flex; flex-direction:column; justify-content:center; }
  .layout-content-with-icon { padding-right:220px; }
  .slide-counter {
    position:fixed; bottom:20px; right:30px; font-size:16px;
    color:rgba(255,255,255,0.3); font-family:'JetBrains Mono',monospace; z-index:100;
  }
</style>
</head>

<div class="slide-counter" id="counter">1 / 2</div>

<script>
(function() {
  const slides = document.querySelectorAll('.slide');
  const counter = document.getElementById('counter');
  let current = 0;
  function update() {
    slides.forEach((s, i) => s.classList.toggle('active', i === current));
    counter.textContent = (current + 1) + ' / ' + slides.length;
  }
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
      e.preventDefault(); if (current < slides.length - 1) { current++; update(); }
    }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      e.preventDefault(); if (current > 0) { current--; update(); }
    }
  });
})();
</script>
